name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, "windows/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify Codex App Server
        shell: pwsh
        run: |
          npm run build
          node scripts/probe-codex.cjs

      - name: Build Windows executables
        run: npm run dist:win

      - name: Create checksums
        run: npm run checksums

